name: Gradle tests

on:
  push:
    branches:
      - main
    paths:
      - 'compiler-plugin/**'
      - 'exempts-fixer/**'
      - 'gradle-plugin/**'
      - 'gradle-plugin-test/**'
      - 'plugin-annotations/**'
      - 'build-logic/**'
      - 'build-logic-settings/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'library.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle-tests.yml'
  workflow_call:
    inputs:
      ref:
        description: 'The commit to test. Empty tests the commit of the caller.'
        type: string
        default: ''

# A newer run of the same event, branch, and tested commit cancels the older run. In a called workflow, `github` is the
# context of the caller, so the group starts with the name of this file and has the `ref` input.
concurrency:
  group: gradle-tests-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WATCHDOG_PROXY_USERNAME: ${{ secrets.WATCHDOG_PROXY_USERNAME }}
  WATCHDOG_PROXY_PASSWORD: ${{ secrets.WATCHDOG_PROXY_PASSWORD }}
  DEVELOCITY_CACHE_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  # A `pull_request` run of the Watchdog bot skips the tests. The Dev kit update and the Pre-publish workflows call this
  # workflow on the commit of their pull request.
  functional-test-matrix:
    if: github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      smoke-versions: ${{ steps.matrix.outputs.smoke-versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          # The matrix jobs wait for this job. A cache save at its end only delays them.
          cache-read-only: true

      - name: Discover Kotlin versions
        id: matrix
        env:
          MATRIX: ${{ github.event_name == 'pull_request' && 'reduced' || 'full' }}
        run: |
          outputs="$(./gradlew -q :gradle-plugin-test:printCiFunctionalTestMatrix "-Pwatchdog.functionalTest.matrix=$MATRIX")"
          echo "$outputs"
          echo "$outputs" >> "$GITHUB_OUTPUT"

  library-checks:
    name: Unit tests and ABI checks
    if: github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run unit tests
        run: |
          ./gradlew \
            :build-logic:test \
            :gradle-plugin:test \
            :gradle-plugin:library-api-watchdog-report-aggregation:test

      - name: Check the ABI dumps
        run: |
          ./gradlew \
            :gradle-plugin:checkKotlinAbi \
            :gradle-plugin:library-api-watchdog-report-aggregation:checkKotlinAbi \
            :plugin-annotations:checkLegacyAbi

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  exempts-fixer-tests:
    if: github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run exempts fixer tests
        run: |
          ./gradlew :library-api-watchdog-exempts-fixer:allTests || {
            echo "Tests failed; retrying once."
            ./gradlew :library-api-watchdog-exempts-fixer:allTests
          }

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  gradle-plugin-tests:
    name: Gradle plugin tests (${{ matrix.kotlin-version }})
    needs: functional-test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin-version: ${{ fromJSON(needs.functional-test-matrix.outputs.versions) }}
    env:
      # With this variable set, the dev kit registers only the Kotlin version that
      # `kotlin.compiler.plugin.devkit.defaultTestVersion` requests. See `config()` in
      # build-logic/src/main/kotlin/kotlinx/library/watchdog/conventions/devkit.kt.
      WATCHDOG_CI_SINGLE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default of the action also requests the obsolete 'tools' package, which sdkmanager doesn't find.
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      # The Gradle and Kotlin daemons of the build hold about 5 GB, and the tests need that memory. So the build runs
      # first with the test task off, and its daemons stop.
      - name: Build the plugins for the tests
        env:
          KOTLIN_VERSION: ${{ matrix.kotlin-version }}
        run: |
          ./gradlew :gradle-plugin-test:defaultFunctionalTest \
            "-Pkotlin.compiler.plugin.devkit.defaultTestVersion=$KOTLIN_VERSION" \
            -Pwatchdog.functionalTest.buildOnly=true
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true

      - name: Run Gradle plugin tests
        env:
          KOTLIN_VERSION: ${{ matrix.kotlin-version }}
        run: |
          scripts/log-memory.sh &
          trap "kill $!" EXIT
          ./gradlew :gradle-plugin-test:defaultFunctionalTest \
            "-Pkotlin.compiler.plugin.devkit.defaultTestVersion=$KOTLIN_VERSION" || {
            echo "Tests failed; retrying once."
            ./gradlew :gradle-plugin-test:defaultFunctionalTest \
              "-Pkotlin.compiler.plugin.devkit.defaultTestVersion=$KOTLIN_VERSION"
          }

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}-${{ matrix.kotlin-version }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  gradle-plugin-smoke-tests:
    name: Gradle plugin smoke tests
    needs: functional-test-matrix
    if: needs.functional-test-matrix.outputs.smoke-versions != ''
    runs-on: ubuntu-latest
    env:
      WATCHDOG_CI_SINGLE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run Gradle plugin smoke tests
        env:
          KOTLIN_VERSIONS: ${{ needs.functional-test-matrix.outputs.smoke-versions }}
        run: |
          scripts/log-memory.sh &
          trap "kill $!" EXIT
          ./gradlew :gradle-plugin-test:allVersionedFunctionalTests \
            "-Pkotlin.compiler.plugin.devkit.testAgainst=$KOTLIN_VERSIONS" \
            -Pwatchdog.functionalTest.smokeOnly=true || {
            echo "Tests failed; retrying once."
            ./gradlew :gradle-plugin-test:allVersionedFunctionalTests \
              "-Pkotlin.compiler.plugin.devkit.testAgainst=$KOTLIN_VERSIONS" \
              -Pwatchdog.functionalTest.smokeOnly=true
          }

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
