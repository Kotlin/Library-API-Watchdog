name: Build docs website

on:
  push:
    branches:
      - main
  # Only a manual run on main deploys the website. The Post-publish workflow starts one after each release.
  workflow_dispatch:
    inputs:
      version:
        description: 'The release version that the website shows, MAJOR.MINOR.PATCH. Its tag must exist.'
        required: true
        type: string

# Runs of one event and branch don't overlap and aren't cancelled, so a deploy to GitHub Pages never stops half way.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The name of the file in the artifact of the Docs checks workflow.
  ASSEMBLE_ARTIFACT: 'assembled.zip'

jobs:
  build:
    uses: ./.github/workflows/docs-checks.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: library-api-watchdog-docs-assembled

      - name: Unzip artifact
        run: unzip -O UTF-8 -qq '${{ env.ASSEMBLE_ARTIFACT }}' -d publish

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Package and upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
