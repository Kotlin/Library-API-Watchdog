name: Compiler plugin tests

on:
  push:
    branches:
      - main
    paths:
      - 'compiler-plugin/**'
      - 'plugin-annotations/**'
      - 'build-logic/**'
      - 'build-logic-settings/**'
      - 'diagnostics.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'library.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/compiler-plugin-tests.yml'
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Berlin'
  workflow_call:
    inputs:
      ref:
        description: 'The commit to test. Empty tests the commit of the caller.'
        type: string
        default: ''

# A newer run of the same event, branch, and tested commit cancels the older run. In a called workflow, `github` is the
# context of the caller, so the group starts with the name of this file and has the `ref` input.
concurrency:
  group: compiler-plugin-tests-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WATCHDOG_PROXY_USERNAME: ${{ secrets.WATCHDOG_PROXY_USERNAME }}
  WATCHDOG_PROXY_PASSWORD: ${{ secrets.WATCHDOG_PROXY_PASSWORD }}
  DEVELOCITY_CACHE_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  # A `pull_request` run of the Watchdog bot skips the tests. The Dev kit update and the Pre-release workflows call this
  # workflow on the commit of their pull request.
  #
  # The daily run of this workflow tests only the newest Kotlin dev build, because the other Kotlin versions don't
  # change. In a called workflow, `github.workflow` is the name of the caller, so a call from a workflow on a schedule
  # runs every test.
  test:
    name: Tests (shard ${{ matrix.shard }})
    if: >-
      (github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN)
      && !(github.event_name == 'schedule' && github.workflow == 'Compiler plugin tests')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run compiler plugin tests
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          REDUCED: ${{ github.event_name == 'pull_request' }}
        run: |
          ./gradlew :library-api-watchdog-compiler-plugin:shardTest \
            "-Pwatchdog.compilerTest.shard=$SHARD" "-Pwatchdog.compilerTest.reduced=$REDUCED" || {
            echo "Tests failed; retrying once."
            ./gradlew :library-api-watchdog-compiler-plugin:shardTest \
              "-Pwatchdog.compilerTest.shard=$SHARD" "-Pwatchdog.compilerTest.reduced=$REDUCED"
          }

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}-${{ matrix.shard }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  latest-kotlin-test:
    name: Tests (newest Kotlin dev build)
    if: github.event_name == 'schedule' && github.workflow == 'Compiler plugin tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Run compiler plugin tests
        run: |
          ./gradlew :library-api-watchdog-compiler-plugin:latestKotlinTest || {
            echo "Tests failed; retrying once."
            ./gradlew :library-api-watchdog-compiler-plugin:latestKotlinTest
          }

      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.job }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  benchmark-corpus-audit:
    name: Benchmark corpus audit
    if: >-
      (github.event_name != 'pull_request' || github.actor != vars.WATCHDOG_BOT_LOGIN)
      && !(github.event_name == 'schedule' && github.workflow == 'Compiler plugin tests')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Audit benchmark corpus
        run: ./gradlew :library-api-watchdog-compiler-plugin:benchmarkCorpusAudit
